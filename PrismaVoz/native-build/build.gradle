plugins { id 'com.android.application' version '8.7.3' }
def appVersion = new groovy.json.JsonSlurper().parse(file('../version.json'))
android {
    namespace 'com.arakaki.prismavoz'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'com.arakaki.prismavoz'; minSdk 26; targetSdk 35; versionCode appVersion.versionCode; versionName appVersion.versionName; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; ndk { abiFilters.addAll(project.hasProperty('emulatorBuild') ? ['x86_64'] : ['arm64-v8a','armeabi-v7a']) } }
    sourceSets { main { manifest.srcFile '../AndroidManifest.xml'; java.srcDirs = ['../src']; res.srcDirs = ['../res']; assets.srcDirs = ['../native-assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false; signingConfig null } }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/NOTICE'] } }
}
dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1'; testImplementation 'junit:junit:4.13.2'; androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test:core:1.6.1'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }

dependencyLocking { lockAllConfigurations() }
