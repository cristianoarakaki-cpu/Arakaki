name: Publicar Folha PDF
on:
  push:
    branches: [main]
    paths: ['Folha/distribution/**', 'Folha/update.json', '.github/workflows/folha-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: folha-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reunir APK assinado e conferir integridade
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('Folha')
          info = json.loads((root/'update.json').read_text())
          parts = sorted((root/'distribution').glob('Folha-PDF.apk.part*'))
          assert parts, 'APK ausente'
          assert info['packageName'] == 'com.folha.pdf'
          assert info['downloadUrl'] == f"https://github.com/${{ github.repository }}/releases/download/folha-v{info['versionName']}/Folha-PDF.apk"
          apk = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(apk).hexdigest() == info['sha256'], 'SHA-256 divergente'
          pathlib.Path('Folha-PDF.apk').write_bytes(apk)
          pathlib.Path('folha-update.json').write_text(json.dumps(info, ensure_ascii=False, indent=2))
          pathlib.Path('release-notes.txt').write_text(info['notes'] + '\n\nInstale sobre a versão anterior, sem desinstalar. Pacote com assinatura preservada. Requer Android 8 ou superior. O Android pede confirmação para instalar.\n')
          pathlib.Path('release-tag.txt').write_text('folha-v'+info['versionName'])
          PY
      - name: Conferir assinatura do APK
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose Folha-PDF.apk
      - name: Publicar versão do Folha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat release-tag.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release já existe. Não substituímos APKs publicados."
            exit 0
          fi
          gh release create "$TAG" Folha-PDF.apk folha-update.json --target "$GITHUB_SHA" --title "Folha PDF ${TAG#folha-v}" --notes-file release-notes.txt --latest=false
