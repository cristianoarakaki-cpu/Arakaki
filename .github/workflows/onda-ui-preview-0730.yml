name: Onda - Previa visual 0730
on:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-ui-preview-0730.yml']
permissions:
  contents: read
  actions: read
jobs:
  failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Onda-Visual-Preview
          path: ui
          github-token: ${{ github.token }}
          run-id: '43452833550'
      - name: Inspecionar hierarquia real da central
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json,xml.etree.ElementTree as ET
          files=list(Path('ui').rglob('failure-screen.xml'));assert len(files)==1
          root=ET.fromstring(files[0].read_bytes())
          print('FAILURE_NODES='+json.dumps([n.attrib for n in root.iter('node')],ensure_ascii=False))
          files=list(Path('ui').rglob('failure-screen.png'));assert len(files)==1
          data=base64.b64encode(files[0].read_bytes()).decode()
          print('FAILURE_IMAGE_BEGIN')
          for i in range(0,len(data),4096):print(data[i:i+4096])
          print('FAILURE_IMAGE_END')
          PY
