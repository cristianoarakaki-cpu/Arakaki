name: Prisma PDF Android
on:
  push:
    branches: [main]
    paths: ['PrismaPDF/assets/**', 'PrismaPDF/src/**', 'PrismaPDF/tools/**', 'PrismaPDF/res/**', 'PrismaPDF/dependencies/**', 'PrismaPDF/version.json', 'PrismaPDF/AndroidManifest.xml', 'PrismaPDF/build.sh', '.github/workflows/prisma-pdf.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prisma-pdf-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar bibliotecas locais e testes
        run: |
          python3 -m pip install 'cryptography==46.0.3'
          python3 PrismaPDF/tools/vendor.py
          node --check PrismaPDF/assets/app.js
          node --check PrismaPDF/assets/flow.js
          node --check PrismaPDF/assets/organizer.js
          node --check PrismaPDF/assets/signature.js
          node --check PrismaPDF/assets/scanner.js
          node --check PrismaPDF/assets/scan-core.js
          node --check PrismaPDF/assets/scan-detect.js
          node PrismaPDF/tools/test_scan_detect.cjs
          node PrismaPDF/tools/test_scan.cjs
          node --check PrismaPDF/assets/compression.js
          node --check PrismaPDF/assets/compression-core.js
          node PrismaPDF/tools/test_compression.cjs
          node --check PrismaPDF/assets/ocr-core.js
          node --check PrismaPDF/assets/ocr-engine.js
          node PrismaPDF/tools/test_ocr.cjs
          node --check PrismaPDF/assets/theme.js
          node --check PrismaPDF/assets/redaction.js
          node --check PrismaPDF/assets/audit.js
          node --check PrismaPDF/assets/audit-core.js
          node PrismaPDF/tools/test_audit.cjs
          node --check PrismaPDF/assets/redaction-core.js
          node PrismaPDF/tools/test_redaction.cjs
          node PrismaPDF/tools/test_core.cjs
          python3 PrismaPDF/tools/test_signing.py
      - name: Testar ferramentas em navegador móvel sem internet
        env:
          PRISMA_NODE_MODULES: ${{ runner.temp }}/prisma-ui/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/prisma-ui" --no-audit --no-fund playwright@1.56.1 pdf-lib@1.17.1
          CHROME_BIN=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_BIN" ]; then
            "$RUNNER_TEMP/prisma-ui/node_modules/.bin/playwright" install --with-deps chromium
          fi
          export CHROME_BIN
          node PrismaPDF/tools/browser_test.cjs
      - name: Preparar SDK Android 35
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Validar compilação sem solicitar secrets
        run: bash PrismaPDF/build.sh verify
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-PDF-validacao-${{ github.run_number }}
          path: |
            PrismaPDF/build/Prisma-PDF-VALIDACAO.apk.unsigned
            PrismaPDF/test-output/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Informar canal de instalação
        run: |
          echo '## Downloads instaláveis' >> "$GITHUB_STEP_SUMMARY"
          echo 'Os APKs assinados são publicados pela Action **Publicar Prisma PDF assinado**, sem exigir cadastro de senha pelo usuário. Esta execução valida o código e produz um artifact não assinado para conferência.' >> "$GITHUB_STEP_SUMMARY"
