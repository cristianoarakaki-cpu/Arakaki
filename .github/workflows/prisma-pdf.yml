name: Prisma PDF Android
on:
  push:
    branches: [main]
    paths: ['PrismaPDF/assets/**', 'PrismaPDF/src/**', 'PrismaPDF/tools/**', 'PrismaPDF/res/**', 'PrismaPDF/dependencies/**', 'PrismaPDF/version.json', 'PrismaPDF/AndroidManifest.xml', 'PrismaPDF/build.sh', '.github/workflows/prisma-pdf.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prisma-pdf-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar bibliotecas locais e testes
        run: |
          python3 -m pip install 'cryptography==46.0.3'
          python3 PrismaPDF/tools/vendor.py
          node --check PrismaPDF/assets/app.js
          node PrismaPDF/tools/test_core.cjs
          python3 PrismaPDF/tools/test_signing.py
      - name: Testar ferramentas em navegador móvel sem internet
        env:
          PRISMA_NODE_MODULES: ${{ runner.temp }}/prisma-ui/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/prisma-ui" --no-audit --no-fund playwright@1.56.1 pdf-lib@1.17.1
          CHROME_BIN=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_BIN" ]; then
            "$RUNNER_TEMP/prisma-ui/node_modules/.bin/playwright" install --with-deps chromium
          fi
          export CHROME_BIN
          node PrismaPDF/tools/browser_test.cjs
      - name: Selecionar modo de compilação
        id: mode
        env:
          PRISMA_SIGNING_PASSWORD: ${{ secrets.PRISMA_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          ready=bool(os.environ.get('PRISMA_SIGNING_PASSWORD'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+('signed' if ready else 'verify')+'\n')
          if not ready:
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Prisma pronto para assinar\nCadastre o secret `PRISMA_SIGNING_PASSWORD` com senha forte de pelo menos 24 caracteres ASCII e execute este workflow novamente. Sem o secret, o APK é compilado apenas para validação, sem assinatura e sem instalação.\n')
          PY
      - name: Preparar assinatura permanente do Prisma
        if: steps.mode.outputs.mode == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
          PRISMA_SIGNING_PASSWORD: ${{ secrets.PRISMA_SIGNING_PASSWORD }}
        run: python3 PrismaPDF/tools/signing.py
      - name: Preparar SDK Android 35
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compilar app Android independente
        env:
          PRISMA_SIGNING_PASSWORD: ${{ secrets.PRISMA_SIGNING_PASSWORD }}
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: bash PrismaPDF/build.sh "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-PDF-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: |
            PrismaPDF/build/Prisma-PDF.apk
            PrismaPDF/build/Prisma-PDF-VALIDACAO.apk.unsigned
            PrismaPDF/test-output/home.png
          if-no-files-found: error
          retention-days: 30
      - name: Publicar APK e habilitar atualizações
        if: steps.mode.outputs.mode == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 PrismaPDF/tools/release.py publish
      - name: Remover chave aberta do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/prisma-signing.p12"
