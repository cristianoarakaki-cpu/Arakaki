name: Prisma Voz — leitor Android nativo
on:
  push:
    branches: ['prismavoz/native-reader']
    paths: ['PrismaVoz/src/**','PrismaVoz/native-build/**','PrismaVoz/native-assets/**','PrismaVoz/AndroidManifest.xml','PrismaVoz/version.json','PrismaVoz/distribution/**','PrismaVoz/tools/**','.github/workflows/prismavoz-native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prior-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Ler diagnóstico da execução anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/cristianoarakaki-cpu/Arakaki/actions/runs/42287767873/logs > /tmp/native-prior-logs.zip
          python3 - <<'PY_LOGS'
          import zipfile,re
          with zipfile.ZipFile('/tmp/native-prior-logs.zip') as z:
              for name in z.namelist():
                  if 'Testar' in name and name.endswith('.txt'):
                      text=z.read(name).decode('utf-8',errors='replace')
                      lines=text.splitlines()
                      selected=[line for line in lines if re.search(r'FAIL|Error|Exception|INSTRUMENTATION|tests|not found|No such|Caused by|OCR|Assertion',line,re.I)]
                      summary='\n'.join(selected[-90:])[-9000:]
                      print('::notice title=Native runtime diagnostics::'+summary.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY_LOGS
  validate-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle verificado
        run: |
          curl -fsSL https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256 -o "$RUNNER_TEMP/gradle.sha256"
          curl -fsSL https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          python3 - <<'PY_GRADLE'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP']);assert hashlib.sha256((p/'gradle.zip').read_bytes()).hexdigest()==(p/'gradle.sha256').read_text().strip()
          PY_GRADLE
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Preparar Android SDK 35
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ] || [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          fi
      - name: Compilar release ARM e executar testes de texto
        run: |
          set +e
          gradle --no-daemon -p PrismaVoz/native-build testReleaseUnitTest assembleRelease > /tmp/prismavoz-native-build-ci.log 2>&1
          native_build_status=$?
          set -e
          cat /tmp/prismavoz-native-build-ci.log
          if [ "$native_build_status" -ne 0 ]; then
            python3 - <<'PY_ERROR'
          import pathlib
          t=pathlib.Path('/tmp/prismavoz-native-build-ci.log').read_text()[-6000:];print('::error title=Native build diagnostics::'+t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY_ERROR
            exit "$native_build_status"
          fi
      - name: Preparar APKs do emulador
        run: gradle --no-daemon -p PrismaVoz/native-build -PemulatorBuild=true assembleDebug assembleDebugAndroidTest
      - name: Habilitar aceleração do emulador
        run: sudo chmod 666 /dev/kvm
      - name: Testar renderizador e OCR real sem conexão no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r PrismaVoz/native-build/build/outputs/apk/debug/PrismaVozNative-debug.apk
            adb install -r PrismaVoz/native-build/build/outputs/apk/androidTest/debug/PrismaVozNative-debug-androidTest.apk
            adb shell am instrument -w com.arakaki.prismavoz.test/androidx.test.runner.AndroidJUnitRunner > /tmp/prismavoz-native-tests.txt
            cat /tmp/prismavoz-native-tests.txt
            python3 -c 's=open("/tmp/prismavoz-native-tests.txt").read(); assert "OK (2 tests)" in s and "FAILURES" not in s, s'
            mkdir -p PrismaVoz/test-output-native
            adb pull /sdcard/Android/data/com.arakaki.prismavoz/files/native-reader.png PrismaVoz/test-output-native/native-reader.png
      - name: Resumir resultado Android
        if: always()
        run: |
          python3 - <<'PY_RESULT'
          from pathlib import Path
          p=Path('/tmp/prismavoz-native-tests.txt')
          if p.exists():
              text=p.read_text()[-7000:];kind='notice' if 'OK (2 tests)' in text else 'error'
              print('::'+kind+' title=Native Android test results::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY_RESULT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Prisma-Voz-nativo-evidencias
          path: |
            PrismaVoz/native-build/build/test-results/
            PrismaVoz/test-output-native/
            /tmp/prismavoz-native-tests.txt
            /tmp/prismavoz-native-build-ci.log

  publish-candidate:
    needs: validate-native
    if: github.ref == 'refs/heads/prismavoz/native-reader'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Conferir candidato assinado e fontes
        run: |
          python3 PrismaVoz/tools/publish_signed.py prepare "$ANDROID_HOME/build-tools/35.0.0"
          python3 PrismaVoz/tools/verify_release.py
      - name: Publicar candidato nativo sem ativar canal automático
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 PrismaVoz/tools/publish_native_candidate.py
