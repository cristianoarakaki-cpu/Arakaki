name: Prisma Voz — validar e publicar
on:
  push:
    branches: [main]
    paths: ['PrismaVoz/**', '.github/workflows/prismavoz.yml']
  pull_request:
    paths: ['PrismaVoz/**', '.github/workflows/prismavoz.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prismavoz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir bibliotecas e lógica de voz
        run: |
          python3 PrismaVoz/tools/vendor.py
          node --check PrismaVoz/assets/app.js
          node --check PrismaVoz/assets/speech.js
          node --check PrismaVoz/assets/speech-core.js
          node PrismaVoz/tools/test_speech.cjs
      - name: Testar leitor, controles, privacidade e OCR offline
        env:
          PRISMA_NODE_MODULES: ${{ runner.temp }}/prismavoz-ui/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/prismavoz-ui" --no-audit --no-fund playwright@1.56.1 pdf-lib@1.17.1
          CHROME_BIN=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_BIN" ]; then
            "$RUNNER_TEMP/prismavoz-ui/node_modules/.bin/playwright" install --with-deps chromium
          fi
          export CHROME_BIN
          node PrismaVoz/tools/browser_test.cjs
      - name: Preparar Android 35 e compilar
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ] || [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          bash PrismaVoz/build.sh verify
      - name: Conferir APK assinado e fontes antes da distribuição
        run: |
          python3 PrismaVoz/tools/publish_signed.py prepare "$ANDROID_HOME/build-tools/35.0.0"
          python3 PrismaVoz/tools/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-Voz-validacao-${{ github.run_number }}
          path: PrismaVoz/test-output/*.png
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Conferir pacote assinado
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner"
          python3 PrismaVoz/tools/vendor.py
          python3 PrismaVoz/tools/publish_signed.py prepare "$BT"
          python3 PrismaVoz/tools/verify_release.py
      - name: Publicar e ativar canal após verificar o download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 PrismaVoz/tools/publish_signed.py publish
