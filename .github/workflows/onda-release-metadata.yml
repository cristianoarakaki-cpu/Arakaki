name: Onda - Reparar metadados de atualização
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-release-metadata.yml']
  workflow_run:
    workflows: ['Onda - Gerar APK Android']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: onda-release-metadata
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Preservar histórico e reduzir resposta para atualizadores instalados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,base64,re
          repo=os.environ["GITHUB_REPOSITORY"]
          assert repo=="cristianoarakaki-cpu/Arakaki"
          token=os.environ["GH_TOKEN"]
          def api(path,data=None,method=None):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"Onda-Update-Metadata"},
                  method=method)
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          releases=api("/releases?per_page=20")
          changed=[]
          for release in releases:
              tag=release["tag_name"];body=release.get("body") or ""
              if release["draft"] or release["prerelease"] or not re.fullmatch(r"onda-v[0-9]+\.[0-9]+\.[0-9]+",tag) or len(body.encode())<12000:continue
              path="release-notes/onda/"+tag+".md"
              archive={"message":"Preservar notas completas de "+tag,"content":base64.b64encode(body.encode()).decode(),"branch":"main"}
              try:
                  old=api("/contents/"+path+"?ref=main")
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
                  old=None
              if old:
                  assert base64.b64decode(old["content"]).decode()==body,"Arquivo existente diferente; notas mantidas"
              else:api("/contents/"+path,archive,"PUT")
              paragraphs=[]
              for paragraph in body.split("\n\n"):
                  if "Histórico das melhorias anteriores" in paragraph:break
                  if sum(map(len,paragraphs))+len(paragraph)>3200:break
                  paragraphs.append(paragraph)
              summary="\n\n".join(paragraphs).strip()
              assert summary
              summary+="\n\n[Histórico e notas completas preservadas](https://github.com/"+repo+"/blob/main/"+path+").\n\nAPK, manifesto de atualização, licenças e código-fonte permanecem nos anexos desta versão. Instale sobre a versão anterior, sem desinstalar.\n"
              before={a["name"]:(a["size"],a.get("digest"),a["id"]) for a in release["assets"]}
              updated=api("/releases/"+str(release["id"]),{"body":summary},"PATCH")
              assert before=={a["name"]:(a["size"],a.get("digest"),a["id"]) for a in updated["assets"]},"Anexos alterados"
              changed.append({"tag":tag,"originalBytes":len(body.encode()),"summaryBytes":len(summary.encode())})
              print(json.dumps(changed[-1]))
          raw=api("/releases?per_page=20")
          size=len(json.dumps(raw,ensure_ascii=False,separators=(",",":")).encode())
          assert size<700000,("Lista ainda grande",size)
          print(json.dumps({"releases":len(raw),"compactResponseBytes":size,"legacyLimit":1048576,"changed":changed},indent=2))
          
          PY
