name: Onda - Ler diagnóstico do Android 15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-radio-city-probe.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Onda-Android35-Diagnostics
          path: diagnostic
          github-token: ${{ github.token }}
          run-id: 41606858325
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('diagnostic').rglob('*'):
              if p.is_file():
                  print('FILE',p.name,p.stat().st_size)
                  if p.suffix in ('.txt','.log'):
                      lines=p.read_text(errors='replace').splitlines()
                      selected=[x for x in lines if re.search(r'YouTubeActivity|PictureInPicture|PipTask|PipTransition|enterPicture|picture.in.picture',x,re.I)]
                      for line in selected[-160:]:print(line[:800])
          PY
