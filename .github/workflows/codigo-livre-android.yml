name: Código Livre IA - Compilar Android offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar motor de IA na revisão fixa
        run: bash CodigoLivre/tools/prepare-engine.sh
      - name: Testar importação e exportação
        working-directory: CodigoLivre
        run: bash tools/test-core.sh
      - name: Compilar e verificar
        run: gradle --no-daemon -p CodigoLivre assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CodigoLivre-Android-arm64-experimental
          path: |
            CodigoLivre/app/build/outputs/apk/release/*.apk
            CodigoLivre/app/build/reports/lint-results-release.*
