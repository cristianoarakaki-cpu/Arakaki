name: Onda - Comparar correcao Atalhos 0725
on:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-shortcuts-check-0725.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar controle negativo com o layout anterior
        run: |
          mkdir -p Onda/.signing
          keytool -genkeypair -keystore Onda/.signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Onda Shortcut Check,O=Onda,C=BR" -keyalg RSA -keysize 2048 -validity 2
          python - <<'PY'
          import pathlib,zlib,base64
          source=zlib.decompress(base64.b64decode('')).decode()
          assert 'new LinearLayout.LayoutParams(dp(84),-2)' in source
          pathlib.Path('Onda/app/src/main/java/br/com/onda/MainActivity.java').write_text(source)
          PY
          gradle --no-daemon -p Onda -PondaEmulator=true assembleDebug assembleDebugAndroidTest
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduzir palavra partida e validar a correcao no mesmo emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -memory 2048
          script: |
            mkdir -p checks
            adb install -r Onda/app/build/outputs/apk/debug/app-debug.apk
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant br.com.onda.musica android.permission.READ_EXTERNAL_STORAGE
            adb shell am instrument -w -e class br.com.onda.ShortcutLayoutTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > checks/before-tests.txt || true
            cat checks/before-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/shortcuts-layout.json > checks/before.json
            adb exec-out run-as br.com.onda.musica cat files/shortcuts-header.png > checks/before.png
            python -c 'import json; r=json.load(open("checks/before.json")); assert len(r["cases"])==8 and any("Atalhos word broken or clipped" in p for p in r["problems"]),r'
            adb shell am force-stop br.com.onda.musica
            git show HEAD:Onda/app/src/main/java/br/com/onda/MainActivity.java > Onda/app/src/main/java/br/com/onda/MainActivity.java
            gradle --no-daemon -p Onda -PondaEmulator=true assembleDebug
            adb install -r Onda/app/build/outputs/apk/debug/app-debug.apk
            adb shell am instrument -w -e class br.com.onda.ShortcutLayoutTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > checks/after-tests.txt
            cat checks/after-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/shortcuts-layout.json > checks/after.json
            adb exec-out run-as br.com.onda.musica cat files/shortcuts-header.png > checks/after.png
            python -c 'import json; r=json.load(open("checks/after.json")); s=open("checks/after-tests.txt").read(); assert len(r["cases"])==8 and not r["problems"] and "OK (1 test)" in s and "FAILURES" not in s,r'
      - name: Mostrar comparacao real de medidas e capturas
        if: always()
        run: |
          python - <<'PY'
          import pathlib,base64
          for state in ['before','after']:
              file=pathlib.Path('checks')/(state+'.json')
              if file.exists():print('SHORTCUT_'+state.upper()+'_JSON='+file.read_text())
              image=pathlib.Path('checks')/(state+'.png')
              if image.exists():
                  print('SHORTCUT_'+state.upper()+'_IMAGE_BEGIN')
                  print(base64.b64encode(image.read_bytes()).decode())
                  print('SHORTCUT_'+state.upper()+'_IMAGE_END')
          PY
      - name: Salvar evidencia da correcao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Onda-Shortcut-Comparison-0725
          path: checks/
