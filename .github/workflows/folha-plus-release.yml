name: Publicar Folha PDF Plus
on:
  push:
    branches: [main]
    paths: ['FPlus/distribution/**', 'FPlus/release.json', 'FPlus/signing-certificate.sha256', 'FPlus/tools/**', '.github/workflows/folha-plus-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: folha-plus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reunir APK original e verificar integridade
        run: python3 FPlus/tools/prepare_release.py
      - name: Verificar assinatura e metadados Android
        shell: bash
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          test -n "$SIGNER" && test -n "$AAPT"
          python3 FPlus/tools/verify_signature.py "$SIGNER" "$AAPT"
      - name: Publicar APK sem substituir versões existentes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG=$(cat release-output/tag.txt)
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-output/draft.txt 2>/dev/null; then
            test "$(cat release-output/draft.txt)" = false || { echo 'Existe um rascunho; revise os arquivos antes de publicar.'; exit 1; }
          else
            gh release create "$TAG" release-output/Folha-PDF.apk release-output/folha-update.json release-output/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Folha PDF+ ${TAG#folha-vplus}" --notes-file release-output/notes.txt --latest=false --draft
            gh release edit "$TAG" --draft=false --latest=false
          fi
      - name: Ativar canal somente após verificar download publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 FPlus/tools/publish_channel.py
