name: Folha PDF Definitivo
on:
  push:
    branches: [main]
    paths: ['FPlusStable/version.json', 'FPlusStable/tools/**', 'FPlus/source/**', '.github/workflows/folha-stable.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: folha-stable-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar biblioteca criptográfica
        run: python3 -m pip install 'cryptography==46.0.3'
      - name: Testar backup criptografado da assinatura
        run: python3 FPlusStable/tools/test_signing.py
      - name: Selecionar modo
        id: mode
        env:
          FOLHA_STABLE_SIGNING_PASSWORD: ${{ secrets.FOLHA_STABLE_SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          ready=bool(os.environ.get('FOLHA_STABLE_SIGNING_PASSWORD'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('mode='+('stable' if ready else 'stable-verify')+'\n')
          if not ready:
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Falta uma configuração única\nCadastre o secret `FOLHA_STABLE_SIGNING_PASSWORD` (senha forte com pelo menos 24 caracteres ASCII) em Settings → Secrets and variables → Actions. Depois execute novamente este workflow. Sem o secret, esta execução só valida a compilação e não gera APK instalável.\n')
          PY
      - name: Preparar assinatura permanente
        if: steps.mode.outputs.mode == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          FOLHA_STABLE_SIGNING_PASSWORD: ${{ secrets.FOLHA_STABLE_SIGNING_PASSWORD }}
        run: python3 FPlusStable/tools/signing.py
      - name: Preparar SDK Android 35
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compilar edição definitiva
        env:
          FOLHA_STABLE_SIGNING_PASSWORD: ${{ secrets.FOLHA_STABLE_SIGNING_PASSWORD }}
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: bash FPlus/source/build.sh "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: Folha-Definitivo-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: |
            FPlus/source/build/Folha-PDF-Stable.apk
            FPlus/source/build/Folha-PDF-Plus-VALIDACAO.apk.unsigned
          if-no-files-found: error
          retention-days: 30
      - name: Publicar download e ativar canal próprio
        if: steps.mode.outputs.mode == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 FPlusStable/tools/release.py publish
      - name: Remover chave privada do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/folha-stable-signing.p12"
