name: Onda - Conferir busca pública de imagens
on:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-image-search-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Consultar temas de imagens sem chave de API
        run: |
          mkdir -p image-probe
          python - <<'PY'
          import urllib.request,urllib.parse,pathlib,re,json,html
          from concurrent.futures import ThreadPoolExecutor
          def query(item):
              key,term=item
              url='https://www.bing.com/images/search?'+urllib.parse.urlencode(dict(q=term,mkt='pt-BR',setlang='pt-br',count=20,first=1,adlt='moderate'))
              request=urllib.request.Request(url,headers={'User-Agent':'Onda/0.68.0 (Android image search)'})
              with urllib.request.urlopen(request,timeout=20) as response:body=response.read(4*1024*1024).decode('utf-8','replace')
              pathlib.Path('image-probe/'+key+'.html').write_text(body)
              records=[]
              for _,raw in re.findall(r'\bm\s*=\s*([\"\'])(.*?)\1',body,re.S):
                  try:
                      record=json.loads(html.unescape(raw))
                      if record.get('murl') and record.get('purl'):records.append(record)
                  except Exception:pass
              return dict(theme=term,bytes=len(body),results=len(records),thumbnailHosts=sorted({urllib.parse.urlsplit(r.get('turl','')).hostname or '' for r in records}),challenge=bool(re.search('verify you are human|captcha',body,re.I)))
          with ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(query,[('motivacao','mensagens de motivação'),('boa-noite','mensagens de boa noite')]))
          pathlib.Path('image-probe/results.json').write_text(json.dumps(results,indent=2,ensure_ascii=False))
          print(json.dumps(results,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Onda-Image-Search-Probe
          path: image-probe
