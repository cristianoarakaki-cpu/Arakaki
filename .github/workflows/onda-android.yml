name: Onda - Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['Onda/**', '.github/workflows/onda-android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verificar parser de letras
        run: |
          javac -d /tmp/onda-tests Onda/app/src/main/java/br/com/onda/Lrc.java Onda/tests/LrcTest.java
          java -cp /tmp/onda-tests br.com.onda.LrcTest
          javac -d /tmp/onda-tests Onda/app/src/main/java/br/com/onda/SearchText.java Onda/tests/SearchTextTest.java
          java -cp /tmp/onda-tests br.com.onda.SearchTextTest
          javac -d /tmp/onda-tests Onda/app/src/main/java/br/com/onda/{SearchText,DjPlanner,VoiceCommand,ListeningMilestones}.java Onda/tests/PersonalDjTest.java
          java -cp /tmp/onda-tests br.com.onda.PersonalDjTest
      - name: Verificar streaming do Internet Archive
        continue-on-error: true
        run: python Onda/tests/check_archive.py
      - name: Conferir busca de catálogo com Chitãozinho e Xororó
        run: python Onda/tests/check_catalog.py
      - name: Reutilizar assinatura de teste
        uses: actions/cache@v4
        with:
          path: Onda/.signing/debug.keystore
          key: onda-musica-debug-signing-v1
      - name: Preparar assinatura persistente de teste
        run: |
          mkdir -p Onda/.signing
          if [ ! -f Onda/.signing/debug.keystore ]; then
            keytool -genkeypair -keystore Onda/.signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Onda Musica Debug,O=Onda,C=BR" -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -exportcert -keystore Onda/.signing/debug.keystore -storepass android -alias androiddebugkey -file /tmp/onda-signing.der
          python -c 'from pathlib import Path; import hashlib; p=Path("Onda/signing-certificate.sha256"); actual=hashlib.sha256(Path("/tmp/onda-signing.der").read_bytes()).hexdigest(); assert not p.exists() or p.read_text().strip()==actual, "Assinatura mudou: recupere a chave antes de distribuir"'
      - name: Compilar a versão anterior para conferir atualização
        run: |
          git fetch --no-tags origin refs/tags/onda-v0.21.1:refs/tags/onda-v0.21.1
          ONDA_OLD_SOURCE="$RUNNER_TEMP/onda-upgrade-source"
          mkdir -p "$ONDA_OLD_SOURCE"
          git archive onda-v0.21.1 Onda | tar -x -C "$ONDA_OLD_SOURCE"
          mkdir -p "$ONDA_OLD_SOURCE/Onda/.signing"
          cp Onda/.signing/debug.keystore "$ONDA_OLD_SOURCE/Onda/.signing/debug.keystore"
          gradle --no-daemon -p "$ONDA_OLD_SOURCE/Onda" -PondaEmulator=true assembleDebug
          mkdir -p Onda/upgrade-fixtures
          cp "$ONDA_OLD_SOURCE/Onda/app/build/outputs/apk/debug/app-debug.apk" Onda/upgrade-fixtures/Onda-0.21.1-x86_64.apk
      - run: gradle --no-daemon -p Onda assembleDebug lintDebug testDebugUnitTest
      - name: Salvar relatórios de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Onda-Build-Reports
          path: |
            Onda/app/build/reports/
            Onda/app/build/intermediates/lint_intermediate_text_report/
      - name: Compactar APK sem alterar o conteúdo
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 1 zopfli==0.2.3.post1
          python Onda/tools/compact_apk.py Onda/app/build/outputs/apk/debug/app-debug.apk /tmp/onda-compact.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f 4 /tmp/onda-compact.apk /tmp/onda-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks Onda/.signing/debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out Onda/app/build/outputs/apk/debug/app-debug.apk /tmp/onda-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Onda/app/build/outputs/apk/debug/app-debug.apk > /tmp/onda-final-certificate.txt
          python -c 'from pathlib import Path; s=Path("/tmp/onda-final-certificate.txt").read_text(); expected=Path("Onda/signing-certificate.sha256").read_text().strip(); assert "Signer #1 certificate SHA-256 digest: "+expected in s, "Assinatura final incorreta"'
      - name: Conferir pacote independente
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Onda/app/build/outputs/apk/debug/app-debug.apk > /tmp/onda-package.txt
          python -c 'import re; s=open("/tmp/onda-package.txt").read(); assert "package: name=\x27br.com.onda.musica\x27 " in s; assert "arm64-v8a" in s and "armeabi-v7a" in s and "x86_64" not in s; print("Pacote independente confirmado")'
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Android-APK
          path: Onda/app/build/outputs/apk/debug/app-debug.apk


      - name: Guardar APK de distribuição e preparar variante do emulador
        run: |
          mkdir -p Onda/distribution
          cp Onda/app/build/outputs/apk/debug/app-debug.apk Onda/distribution/Onda-Musica.apk
          python -c 'from pathlib import Path; p=Path("Onda/distribution/Onda-Musica.apk"); assert p.stat().st_size <= 64*1024*1024, "APK excede o limite do atualizador anterior"; print("APK de distribuição:",p.stat().st_size,"bytes")'
          gradle --no-daemon -p Onda -PondaEmulator=true assembleDebug
      - name: Preparar gerador de vídeos de teste
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            python -m pip install --disable-pip-version-check --timeout 30 --retries 1 imageio-ffmpeg==0.6.0
            python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import imageio_ffmpeg
          directory = Path(os.environ["RUNNER_TEMP"]) / "onda-bin"
          directory.mkdir(exist_ok=True)
          executable = directory / "ffmpeg"
          shutil.copyfile(imageio_ffmpeg.get_ffmpeg_exe(), executable)
          executable.chmod(0o755)
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(directory) + "\n")
          PY
          fi
      - name: Preparar amostras para os testes de MP3
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root=Path("Onda/app/src/androidTest/assets")
          root.mkdir(parents=True,exist_ok=True)
          def run(*args): subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",*args],check=True,timeout=90)
          run("-f","lavfi","-i","color=c=blue:s=320x180:r=15","-f","lavfi","-i","sine=frequency=440:sample_rate=44100","-t","3","-c:v","libx264","-pix_fmt","yuv420p","-c:a","aac",str(root/"combined.mp4"))
          run("-i",str(root/"combined.mp4"),"-an","-c:v","copy",str(root/"video.mp4"))
          run("-i",str(root/"combined.mp4"),"-vn","-c:a","copy",str(root/"audio.m4a"))
          run("-i",str(root/"combined.mp4"),"-vn","-ac","2","-ar","48000","-c:a","aac",str(root/"audio-stereo.m4a"))
          run("-i",str(root/"audio.m4a"),"-c:a","flac",str(root/"audio-flac.flac"))
          run("-i",str(root/"audio.m4a"),"-c:a","pcm_s16le",str(root/"audio-pcm.wav"))
          run("-i",str(root/"audio.m4a"),"-c:a","libmp3lame",str(root/"audio-lossy.mp3"))
          run("-i",str(root/"audio.m4a"),"-c:a","libopus",str(root/"audio-opus.ogg"))
          run("-i",str(root/"audio.m4a"),"-c:a","libvorbis",str(root/"audio-vorbis.ogg"))
          run("-i",str(root/"audio.m4a"),"-ar","22050","-c:a","aac",str(root/"audio-low.m4a"))
          run("-i",str(root/"audio.m4a"),"-ac","6","-c:a","aac",str(root/"audio-surround.m4a"))
          PY
          python - <<'PYVOICE'
          import wave,math,struct
          with wave.open('Onda/app/src/androidTest/assets/speech.wav','wb') as wav:
              wav.setnchannels(1);wav.setsampwidth(2);wav.setframerate(16000)
              tone=b''.join(struct.pack('<h',int(4000*math.sin(2*math.pi*400*n/16000))) for n in range(16000))
              wav.writeframes(tone+b'\x00'*16000*2*8+tone*3)
          PYVOICE
          gradle --no-daemon -p Onda -PondaEmulator=true assembleDebugAndroidTest
      - name: Habilitar aceleração do emulador
        run: sudo chmod 666 /dev/kvm
      - name: Conferir exclusão no Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          avd-name: onda-delete-35
          disk-size: 2048M
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb install -r Onda/app/build/outputs/apk/debug/app-debug.apk
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant br.com.onda.musica android.permission.READ_MEDIA_AUDIO
            adb shell pm grant br.com.onda.musica android.permission.READ_MEDIA_VIDEO
            adb shell am instrument -w -e class br.com.onda.DeleteMediaTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-delete-35-tests.txt
            cat /tmp/onda-delete-35-tests.txt
            python -c 's=open("/tmp/onda-delete-35-tests.txt").read(); assert "OK (3 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
      - name: Liberar disco após o Android 15
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" delete avd --name onda-delete-35
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall 'system-images;android-35;google_apis;x86_64'
      - name: Conferir telas no Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          disk-size: 2048M
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            python Onda/tools/check_upgrade.py
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant br.com.onda.musica android.permission.READ_EXTERNAL_STORAGE
            adb shell am instrument -w -e class br.com.onda.DeleteMediaTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-delete-29-tests.txt
            cat /tmp/onda-delete-29-tests.txt
            python -c 's=open("/tmp/onda-delete-29-tests.txt").read(); assert "OK (3 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb shell am instrument -w -e class br.com.onda.CodecEvolutionTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-codec-tests.txt
            cat /tmp/onda-codec-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/codec-tests.json > Onda/ui-preview/codec-tests.json || true
            python -c 's=open("/tmp/onda-codec-tests.txt").read(); assert "OK (3 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb shell am instrument -w -e class br.com.onda.LightweightTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-lightweight-tests.txt
            cat /tmp/onda-lightweight-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/lightweight-tests.json > Onda/ui-preview/lightweight-tests.json || true
            python -c 's=open("/tmp/onda-lightweight-tests.txt").read(); assert "OK (2 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb shell am instrument -w -e class br.com.onda.DownloadExpansionTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-download-expansion-tests.txt
            cat /tmp/onda-download-expansion-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/youtube-ui.png > Onda/ui-preview/85-youtube-tab.png || true
            adb exec-out run-as br.com.onda.musica cat files/youtube-voice-ui.png > Onda/ui-preview/89-youtube-voz.png || true
            adb exec-out run-as br.com.onda.musica cat files/youtube-protection-ui.png > Onda/ui-preview/90-youtube-protecao.png || true
            python -c 's=open("/tmp/onda-download-expansion-tests.txt").read(); assert "OK (8 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.onda.PdfOcrTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-ocr-tests.txt
            cat /tmp/onda-ocr-tests.txt
            python -c 's=open("/tmp/onda-ocr-tests.txt").read(); assert "OK (4 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.onda.OriginalMediaTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-original-media-tests.txt
            cat /tmp/onda-original-media-tests.txt
            python -c 's=open("/tmp/onda-original-media-tests.txt").read(); assert "OK (5 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            python Onda/tools/check_media_links.py
            python Onda/tools/check_public_downloads.py
            adb shell am instrument -w -e class br.com.onda.TiktokDownloadTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-tiktok-download-tests.txt
            cat /tmp/onda-tiktok-download-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/tiktok-download-tests.json > Onda/ui-preview/tiktok-download-tests.json
            python -c 's=open("/tmp/onda-tiktok-download-tests.txt").read(); assert "OK (1 test)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.onda.ConnectSessionTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-connect-tests.txt
            cat /tmp/onda-connect-tests.txt
            python -c 's=open("/tmp/onda-connect-tests.txt").read(); assert "OK (5 tests)" in s and "FAILURES" not in s'
            python Onda/tools/check_connect.py
            adb shell am instrument -w -e class br.com.onda.ConnectStorageTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-connect-storage-tests.txt
            cat /tmp/onda-connect-storage-tests.txt
            python -c 's=open("/tmp/onda-connect-storage-tests.txt").read(); assert "OK (1 test)" in s and "FAILURES" not in s'
            adb shell am instrument -w -e class br.com.onda.AutoDestinationTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-auto-destination-tests.txt
            cat /tmp/onda-auto-destination-tests.txt
            adb exec-out run-as br.com.onda.musica cat files/auto-destination.png > Onda/ui-preview/87-auto-destination.png || true
            python -c 's=open("/tmp/onda-auto-destination-tests.txt").read(); assert "OK (5 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb shell am instrument -w -e class br.com.onda.DownloadOrganizationTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-download-organization-tests.txt
            cat /tmp/onda-download-organization-tests.txt
            python -c 's=open("/tmp/onda-download-organization-tests.txt").read(); assert "OK (6 tests)" in s and "FAILURES" not in s'
            adb shell am instrument -w -e class br.com.onda.FavoriteCopiesTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-favorite-copies-tests.txt
            cat /tmp/onda-favorite-copies-tests.txt
            python -c 's=open("/tmp/onda-favorite-copies-tests.txt").read(); assert "OK (2 tests)" in s and "FAILURES" not in s'
            adb shell am instrument -w -e class br.com.onda.EvolutionTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-evolution-tests.txt
            cat /tmp/onda-evolution-tests.txt
            python -c 's=open("/tmp/onda-evolution-tests.txt").read(); assert "OK (5 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            python Onda/tools/check_download_center.py
            adb shell am instrument -w -e class br.com.onda.AppearanceTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-appearance-tests.txt
            cat /tmp/onda-appearance-tests.txt
            python -c 's=open("/tmp/onda-appearance-tests.txt").read(); assert "OK (1 test)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            python Onda/tools/check_appearance.py
            adb shell am force-stop br.com.onda.musica
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.onda.SpeechProcessorTest,br.com.onda.SpeechPlaybackTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-speech-tests.txt
            cat /tmp/onda-speech-tests.txt
            python -c 's=open("/tmp/onda-speech-tests.txt").read(); assert "OK (5 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            python Onda/tools/check_menus.py
            python Onda/tools/check_pdf.py
            python Onda/tools/check_open_background.py
            python Onda/tools/check_shelf.py
            python Onda/tools/check_unified_search.py
            adb shell am instrument -w -e class br.com.onda.SearchIndexTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-search-tests.txt
            cat /tmp/onda-search-tests.txt
            python -c 's=open("/tmp/onda-search-tests.txt").read(); assert "OK (2 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class br.com.onda.ShelfStoreTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-shelf-tests.txt
            cat /tmp/onda-shelf-tests.txt
            python -c 's=open("/tmp/onda-shelf-tests.txt").read(); assert "OK (2 tests)" in s and "FAILURES" not in s'
            python Onda/tools/check_speech_ui.py
            adb shell am force-stop br.com.onda.musica
            adb shell pm clear br.com.onda.musica
            adb shell pm clear com.android.documentsui
            python Onda/tools/check_video.py
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e notClass br.com.onda.DeleteMediaTest,br.com.onda.CodecEvolutionTest,br.com.onda.LightweightTest,br.com.onda.AutoDestinationTest,br.com.onda.DownloadExpansionTest,br.com.onda.PdfOcrTest,br.com.onda.AppearanceTest,br.com.onda.EvolutionTest,br.com.onda.FavoriteCopiesTest,br.com.onda.DownloadOrganizationTest,br.com.onda.TiktokDownloadTest,br.com.onda.DjMemoryIntegrationTest,br.com.onda.ShelfStoreTest,br.com.onda.SpeechProcessorTest,br.com.onda.SpeechPlaybackTest,br.com.onda.SearchIndexTest,br.com.onda.ConnectSessionTest,br.com.onda.ConnectStorageTest,br.com.onda.OriginalMediaTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-native-tests.txt
            cat /tmp/onda-native-tests.txt
            python -c 's=open("/tmp/onda-native-tests.txt").read(); assert "OK (30 tests)" in s and "FAILURES" not in s'
            adb shell am force-stop br.com.onda.musica
            adb shell am instrument -w -e class br.com.onda.DjMemoryIntegrationTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > /tmp/onda-memory-tests.txt
            cat /tmp/onda-memory-tests.txt
            python -c 's=open("/tmp/onda-memory-tests.txt").read(); assert "OK (2 tests)" in s and "FAILURES" not in s'
            python Onda/tools/check_dj_memory.py
            python Onda/tools/check_downloads.py
      - name: Salvar capturas das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Onda-Visual-Preview
          path: |
            Onda/ui-preview/
            Onda/download-preview/
            /tmp/onda-native-tests.txt
            /tmp/onda-shelf-tests.txt
            /tmp/onda-speech-tests.txt
            /tmp/onda-search-tests.txt
            /tmp/onda-connect-tests.txt
            /tmp/onda-connect-storage-tests.txt
            /tmp/onda-original-media-tests.txt
            /tmp/onda-tiktok-download-tests.txt
            /tmp/onda-download-organization-tests.txt
            /tmp/onda-favorite-copies-tests.txt
            /tmp/onda-evolution-tests.txt
            /tmp/onda-appearance-tests.txt
            /tmp/onda-ocr-tests.txt
            /tmp/onda-lightweight-tests.txt
            /tmp/onda-codec-tests.txt
            /tmp/onda-delete-29-tests.txt
            /tmp/onda-delete-35-tests.txt
            /tmp/onda-download-expansion-tests.txt
            /tmp/onda-auto-destination-tests.txt
            /tmp/onda-memory-tests.txt
            Onda/app/build/reports/

      - name: Preparar publicação da atualização
        id: update_release
        run: python Onda/tools/prepare_release.py
      - name: Publicar APK para atualização pelo app
        env:
          GH_TOKEN: ${{ github.token }}
          ONDA_TAG: ${{ steps.update_release.outputs.tag }}
          ONDA_VERSION: ${{ steps.update_release.outputs.version }}
        run: |
          if gh release view "$ONDA_TAG" >/dev/null 2>&1; then
            echo "Esta versão já foi publicada. Para distribuir mudanças, incremente versionCode e versionName."
          else
            git archive --format=zip --output=Onda/release-out/Onda-Fontes.zip HEAD Onda .github/workflows/onda-android.yml
            curl --fail --location --retry 2 https://github.com/TeamNewPipe/NewPipeExtractor/archive/refs/tags/v0.26.5.zip -o Onda/release-out/NewPipeExtractor-Fontes.zip
            curl --fail --location --retry 2 https://github.com/lameproject/lame/archive/1f5cc9487284d5950343aa5d4f70de433468070a.zip -o Onda/release-out/LAME-Fontes.zip
            sha256sum Onda/release-out/Onda-Musica.apk > Onda/release-out/SHA256SUMS.txt
            CURRENT_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$CURRENT_HEAD" != "$GITHUB_SHA" ]; then
              BUILT_ONDA=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA" --jq '.tree[] | select(.path == "Onda") | .sha')
              CURRENT_ONDA=$(gh api "repos/$GITHUB_REPOSITORY/git/trees/$CURRENT_HEAD" --jq '.tree[] | select(.path == "Onda") | .sha')
              BUILT_WORKFLOW=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/onda-android.yml?ref=$GITHUB_SHA" --jq '.sha')
              CURRENT_WORKFLOW=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/onda-android.yml?ref=$CURRENT_HEAD" --jq '.sha')
              if [ -z "$BUILT_ONDA" ] || [ -z "$BUILT_WORKFLOW" ] || [ "$BUILT_ONDA" != "$CURRENT_ONDA" ] || [ "$BUILT_WORKFLOW" != "$CURRENT_WORKFLOW" ]; then
                echo "Onda ou sua verificação mudou: a publicação aguarda o build atualizado."
                exit 0
              fi
              echo "Somente outros projetos mudaram; o Onda publicado corresponde exatamente ao código testado."
            fi
            gh release create "$ONDA_TAG" Onda/release-out/Onda-Musica.apk Onda/release-out/onda-update.json Onda/release-out/Onda-Fontes.zip Onda/release-out/NewPipeExtractor-Fontes.zip Onda/release-out/LAME-Fontes.zip Onda/release-out/SHA256SUMS.txt --target "$CURRENT_HEAD" --latest=true --title "Onda Música $ONDA_VERSION" --notes-file Onda/release-out/notes.md
          fi
