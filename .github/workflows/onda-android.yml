name: Onda - Gerar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['Onda/**', '.github/workflows/onda-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar parser de letras
        run: |
          javac -d /tmp/onda-tests Onda/app/src/main/java/br/com/onda/Lrc.java Onda/tests/LrcTest.java
          java -cp /tmp/onda-tests br.com.onda.LrcTest
      - name: Verificar streaming do Internet Archive
        continue-on-error: true
        run: python Onda/tests/check_archive.py
      - run: gradle --no-daemon -p Onda assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Android-APK
          path: Onda/app/build/outputs/apk/debug/app-debug.apk
