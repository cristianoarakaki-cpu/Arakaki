name: Onda - Auditoria visual 0724
on:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-ui-audit-0724.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar somente a auditoria do emulador
        run: |
          mkdir -p Onda/.signing
          keytool -genkeypair -keystore Onda/.signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Onda UI Audit,O=Onda,C=BR" -keyalg RSA -keysize 2048 -validity 2
          python - <<'PY'
          import base64,pathlib,zlib
          pathlib.Path('Onda/app/src/androidTest/java/br/com/onda/ScreenLayoutReviewTest.java').write_bytes(zlib.decompress(base64.b64decode('')))
          pathlib.Path('Onda/app/src/main/java/br/com/onda/MainActivity.java').write_bytes(zlib.decompress(base64.b64decode('')))
          pathlib.Path('Onda/app/src/main/java/br/com/onda/OnlineActivity.java').write_bytes(zlib.decompress(base64.b64decode('')))
          pathlib.Path('Onda/app/src/main/java/br/com/onda/DjActivity.java').write_bytes(zlib.decompress(base64.b64decode('')))
          PY
          gradle --no-daemon -p Onda -PondaEmulator=true assembleDebug assembleDebugAndroidTest
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Auditar 28 telas com fonte ampliada em duas larguras
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -memory 2048
          script: |
            adb install -r Onda/app/build/outputs/apk/debug/app-debug.apk
            adb install -r Onda/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant br.com.onda.musica android.permission.READ_EXTERNAL_STORAGE
            mkdir -p audit
            adb shell am instrument -w -e class br.com.onda.ScreenLayoutReviewTest br.com.onda.musica.test/androidx.test.runner.AndroidJUnitRunner > audit/tests.txt
            cat audit/tests.txt
            adb exec-out run-as br.com.onda.musica cat files/screen-layout-review-normal.json > audit/normal.json
            adb exec-out run-as br.com.onda.musica cat files/screen-layout-review-compact.json > audit/compact.json
            adb exec-out run-as br.com.onda.musica tar -C files -cf - . > audit/screens.tar
            python -c 'from pathlib import Path; [print("UI_AUDIT_REPORT="+p.read_text()) for p in Path("audit").glob("*.json")]'
      - name: Salvar auditoria e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Onda-UI-Audit-0724
          path: audit/
