name: Compilar Folha PDF Plus
on:
  push:
    branches: [main]
    paths: ['FPlus/source/**', 'FPlus/signing/**', '.github/workflows/folha-plus-build.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto publica somente com chave original configurada; verify valida sem gerar chave descartável'
        type: choice
        options: [auto, verify, production]
        default: auto
permissions:
  contents: write
concurrency:
  group: folha-plus-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verificar configuração segura da assinatura
        run: python3 FPlus/signing/test_configure.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar ferramentas Android 35
        shell: bash
        run: |
          if [ -f "$ANDROID_HOME/platforms/android-35/android.jar" ] && [ -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            echo 'SDK Android 35 já instalado.'
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Escolher tipo de compilação
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'auto' }}
          FPLUS_KEYSTORE_BASE64: ${{ secrets.FPLUS_KEYSTORE_BASE64 }}
          FPLUS_STORE_PASSWORD: ${{ secrets.FPLUS_STORE_PASSWORD }}
          FPLUS_KEY_PASSWORD: ${{ secrets.FPLUS_KEY_PASSWORD }}
          FPLUS_KEY_ALIAS: ${{ secrets.FPLUS_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os
          mode=os.environ['REQUESTED_MODE']
          ready=all(os.environ.get(k) for k in ['FPLUS_KEYSTORE_BASE64','FPLUS_STORE_PASSWORD','FPLUS_KEY_PASSWORD','FPLUS_KEY_ALIAS'])
          if mode=='production' and not ready: raise SystemExit('Configure os quatro secrets FPLUS da chave original antes de publicar.')
          if mode=='auto': mode='production' if ready else 'verify'
          assert mode in ['production','verify']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('mode='+mode+'\n')
          print('Compilação selecionada:',mode)
          PY
      - name: Compilar e verificar APK
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
          FPLUS_KEYSTORE_BASE64: ${{ secrets.FPLUS_KEYSTORE_BASE64 }}
          FPLUS_STORE_PASSWORD: ${{ secrets.FPLUS_STORE_PASSWORD }}
          FPLUS_KEY_PASSWORD: ${{ secrets.FPLUS_KEY_PASSWORD }}
          FPLUS_KEY_ALIAS: ${{ secrets.FPLUS_KEY_ALIAS }}
        run: bash FPlus/source/build.sh "$BUILD_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: Folha-PDF-Plus-${{ steps.mode.outputs.mode }}-${{ github.run_number }}
          path: |
            FPlus/source/build/Folha-PDF.apk
            FPlus/source/build/Folha-PDF-Plus-VALIDACAO.apk.unsigned
          if-no-files-found: error
          retention-days: 30
      - name: Publicar versão com assinatura original
        if: steps.mode.outputs.mode == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat release-output/tag.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Tag já existe. Aumente a versão; não substituímos releases.'
            exit 1
          fi
          gh release create "$TAG" release-output/Folha-PDF.apk release-output/folha-update.json release-output/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Folha PDF+ ${TAG#folha-vplus}" --notes-file release-output/notes.txt --latest=false --draft
          gh release edit "$TAG" --draft=false --latest=false
          python3 FPlus/tools/publish_channel.py
