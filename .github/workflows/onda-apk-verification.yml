name: Onda - Separar APK para verificação
on:
  push:
    branches: [main]
    paths: ['.github/workflows/onda-apk-verification.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  SOURCE_RUN: '41715299411'
  SOURCE_SHA: '701ed9aa7fb9980be599243891e7b0f287468958'
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Conferir origem do artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/onda-build.json
          python - <<'PY'
          import json,os
          run=json.load(open('/tmp/onda-build.json'))
          assert run['head_sha']==os.environ['SOURCE_SHA'] and run['head_branch']=='main' and run['event']=='push'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Onda-Android-APK
          path: verify
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verificar assinatura, pacote e conteúdo do APK real
        run: |
          ONDA_APK=$(find verify -name '*.apk' -type f | head -1)
          ONDA_SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          ONDA_AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$ONDA_APK" && test -x "$ONDA_SIGNER" && test -x "$ONDA_AAPT"
          "$ONDA_SIGNER" verify --verbose --print-certs "$ONDA_APK" > verify/apk-signature.txt
          cat verify/apk-signature.txt
          "$ONDA_AAPT" dump badging "$ONDA_APK" > verify/apk-info.txt
          "$ONDA_AAPT" dump xmltree "$ONDA_APK" AndroidManifest.xml > verify/apk-manifest.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile,re,json,hashlib,os
          apk=next(Path('verify').rglob('*.apk'))
          cert=Path('verify/apk-signature.txt').read_text()
          fingerprint=re.search(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',cert).group(1).lower()
          assert fingerprint=='e383d28a3a2027acc70218617bed51c9871e1c2e748f0e5ce846480a5becb54e'
          info=Path('verify/apk-info.txt').read_text()
          assert "package: name='br.com.onda.musica' versionCode='85' versionName='0.71.0'" in info
          manifest=Path('verify/apk-manifest.txt').read_text()
          youtube=next(part for part in manifest.split('E: activity') if 'YouTubeActivity' in part)
          assert any('supportsPictureInPicture' in line and '0x0' in line for line in youtube.splitlines())
          assert any('resizeableActivity' in line and '0xffffffff' in line for line in youtube.splitlines())
          local_video=next(part for part in manifest.split('E: activity') if 'br.com.onda.VideoActivity' in part)
          assert any('supportsPictureInPicture' in line and '0xffffffff' in line for line in local_video.splitlines())
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              abis=sorted({p.split('/')[1] for p in z.namelist() if p.startswith('lib/') and p.endswith('.so')})
              assert abis==['arm64-v8a','armeabi-v7a']
              city_count=len(json.loads(z.read('assets/radio-cities-br.json')))
              assert 5500<=city_count<6000
              assert b'MIT License' in z.read('assets/radio-cities-license.txt')
              dex=b''.join(z.read(p) for p in z.namelist() if p.endswith('.dex'))
              for cls in [b'Ui$MenuButton;',b'RadioCity;',b'YouTubeActivity;',b'WebImages;',b'WebImageFiles;',b'ImageSearchActivity;',b'ImageSharing;',b'RadioActivity;',b'MessageCards;']:
                  assert cls in dex
              assert b'analysisFailed' in dex and b'DownloadHistory;' in dex
              for added in [b'YouTubeAudio;',b'YouTubeAudioPlayback;',b'AudioChaptersActivity;',b'AudioChapterScanner;',b'AudioChapterStore;',b'SilenceChapters;']:
                  assert added in dex
              for removed in [b'YouTubePipControls;',b'IptvActivity;',b'IptvPlayerActivity;',b'IptvPlaylist;',b'IptvStore;',b'PlatformBrowserActivity;']:
                  assert removed not in dex
          report=dict(version='0.71.0',versionCode=85,bytes=apk.stat().st_size,sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),certificate=fingerprint,abis=abis,zipIntegrity=True,youtubeAutomaticPictureInPicture=False,nativeYouTubeAudio=True,localVideoPictureInPicture=True,offlineBrazilCityCount=city_count,menuIconIndependentFromFont=True)
          update=dict(versionCode=report['versionCode'],versionName=report['version'],packageName='br.com.onda.musica',apkUrl=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/onda-v{report['version']}/Onda-Musica.apk",sha256=report['sha256'])
          encoded=(json.dumps(update,indent=2)+'\n').encode()
          report['updateManifestBytes']=len(encoded)
          report['updateManifestSha256']=hashlib.sha256(encoded).hexdigest()
          Path('verify/apk-verified.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Dividir cópia exata sem alterar o APK
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          apks=list(Path('verify').rglob('*.apk'));assert len(apks)==1
          data=apks[0].read_bytes();assert len(data)<=64*1024*1024
          parts=[]
          for index,start in enumerate(range(0,len(data),24*1024*1024),1):
              chunk=data[start:start+24*1024*1024]
              p=Path('verify')/f'part-{index}.bin';p.write_bytes(chunk)
              parts.append(dict(file=p.name,bytes=len(chunk),sha256=hashlib.sha256(chunk).hexdigest()))
          manifest=dict(sourceRun=os.environ['SOURCE_RUN'],sourceSha=os.environ['SOURCE_SHA'],bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),parts=parts)
          Path('verify/parts.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Verify-Part-1
          path: |
            verify/part-1.bin
            verify/parts.json
            verify/apk-verified.json
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Verify-Part-2
          path: verify/part-2.bin
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-Verify-Part-3
          path: verify/part-3.bin
          compression-level: 0

