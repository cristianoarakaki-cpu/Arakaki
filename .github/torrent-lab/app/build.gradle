plugins { id 'com.android.application' }
android {
 namespace 'br.com.onda.torrentprobe';compileSdk 36
 defaultConfig {applicationId 'br.com.onda.torrentprobe';minSdk 26;targetSdk 35;versionCode 1;versionName 'probe';testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'}
 compileOptions {coreLibraryDesugaringEnabled true;sourceCompatibility JavaVersion.VERSION_17;targetCompatibility JavaVersion.VERSION_17}
 packaging {resources {excludes += ['META-INF/INDEX.LIST','META-INF/DEPENDENCIES'];merges += ['META-INF/LICENSE*','META-INF/NOTICE*']}}
}
dependencies {
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
 implementation('com.github.atomashpolskiy:bt-core:1.10'){exclude group:'com.google.inject',module:'guice'}
 implementation('com.github.atomashpolskiy:bt-dht:1.10'){exclude group:'com.google.inject',module:'guice';exclude group:'mldht.core',module:'libmldht'}
 implementation 'com.google.inject:guice:4.2.3:no_aop'
 implementation 'com.google.guava:guava:33.3.1-android'
 implementation 'org.yaml:snakeyaml:2.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'junit:junit:4.13.2'
}
