plugins { id 'com.android.application' }
android {
    namespace 'br.com.onda'
    compileSdk 36
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; applicationId 'br.com.onda.musica'; minSdk 26; targetSdk 35; versionCode 48; versionName '0.39.0'; ndk { abiFilters.addAll(project.hasProperty('ondaEmulator') ? ['x86_64'] : ['arm64-v8a', 'armeabi-v7a']) } }
    signingConfigs {
        debug {
            storeFile file('../.signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    packaging { jniLibs { useLegacyPackaging true }; resources { merges += ['**/LICENSE*', '**/NOTICE*', 'META-INF/DEPENDENCIES', 'META-INF/versions/**/OSGI-INF/MANIFEST.MF'] } }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
}
