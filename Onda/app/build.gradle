plugins { id 'com.android.application' }
android {
    namespace 'br.com.onda'
    compileSdk 36
    defaultConfig { applicationId 'br.com.onda.musica'; minSdk 26; targetSdk 35; versionCode 23; versionName '0.20.0'; ndk { abiFilters.addAll(project.hasProperty('ondaEmulator') ? ['x86_64'] : ['arm64-v8a', 'armeabi-v7a']) } }
    signingConfigs {
        debug {
            storeFile file('../.signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
}
